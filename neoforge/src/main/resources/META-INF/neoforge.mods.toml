modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"
[[mods]] #mandatory
   modId = "${mod_id}"
   version = "${version}"
   displayName = "${mod_name}"
   displayURL="https://www.curseforge.com/minecraft/mc-mods/fuel-info"
   logoFile="icon.png"
   credits="${credits}"
   authors = "${mod_author}"
   description = '''${description}'''
[[mixins]]
   config = "${mod_id}.mixins.json"
[[mixins]]
   config = "${mod_id}.neoforge.mixins.json"
[[dependencies.fuelinfo]]
   modId="neoforge"
   type="required"
   versionRange="[${neoforge_version},)"
   ordering="NONE"
   side="CLIENT"
[[dependencies.fuelinfo]]
   modId = "yet_another_config_lib_v3"
   type = "required"
   versionRange = "1.0" # any version
   ordering = "NONE"
   side = "CLIENT"
[[dependencies.fuelinfo]]
   modId="minecraft"
   type="required"
   versionRange="${minecraft_version_range}"
   ordering="NONE"
   side="CLIENT"